name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode clean package

      - name: Resolve application artifact
        id: artifact
        shell: bash
        run: |
          version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "jar=target/upmc-$version.jar" >> "$GITHUB_OUTPUT"

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install --yes xvfb

      - name: Smoke-test standalone application
        shell: bash
        run: |
          set +e
          timeout 10s xvfb-run --auto-servernum java -jar "${{ steps.artifact.outputs.jar }}"
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "Application exited unexpectedly with status $status"
            exit 1
          fi

      - name: Upload standalone application
        uses: actions/upload-artifact@v7
        with:
          name: upmc-standalone
          path: |
            ${{ steps.artifact.outputs.jar }}
            upmc.sh
            upmc.bat
          if-no-files-found: error
